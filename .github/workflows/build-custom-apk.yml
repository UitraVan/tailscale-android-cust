name: Build Tailscale Proxy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Clone and Patch Core Tailscale
        run: |
          echo "=== 1. Клонируем основной репозиторий tailscale ==="
          git clone --depth 1 https://github.com/tailscale/tailscale.git core-tailscale

          echo "=== 2. Разрешаем SOCKS5 на Android в socks.go ==="
          sed -i 's/!android && //g' core-tailscale/net/netns/socks.go

          echo "=== 3. Добавляем исключение для 127.0.0.1 в netns_android.go ==="
          python3 -c "
          path = 'core-tailscale/net/netns/netns_android.go'
          with open(path, 'r') as f:
              content = f.read()
          old = 'func controlC(network, address string, c syscall.RawConn) error {'
          new = old + '\n\tif isLocalhost(address) {\n\t\treturn nil\n\t}'
          if old in content:
              content = content.replace(old, new, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print('netns_android.go patched successfully')
          else:
              print('Warning: pattern not matched')
              exit(1)
          "

          echo "=== 4. Прописываем ALL_PROXY на 127.0.0.1:10808 ==="
          python3 -c "
          path = 'core-tailscale/net/netns/socks.go'
          with open(path, 'r') as f:
              content = f.read()
          old = 'func init() {'
          new = old + '\n\tos.Setenv(\"ALL_PROXY\", \"socks5://127.0.0.1:10808\")'
          content = 'import \"os\"\n' + content.replace(old, new, 1)
          with open(path, 'w') as f:
              f.write(content)
          print('socks.go proxy patched successfully')
          "

          echo "=== 5. Подменяем зависимость tailscale.com на локальный патченный клон ==="
          go mod edit -replace tailscale.com=./core-tailscale

      - name: Build APK via Makefile
        run: |
          make tailscale-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug-apk
          path: tailscale-debug.apk
          retention-days: 7
