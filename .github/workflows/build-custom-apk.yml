name: Build Tailscale Proxy APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-custom-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Clone and Patch Core Tailscale
        run: |
          echo "=== 1. Клонируем core tailscale ==="
          git clone --depth 1 https://github.com/tailscale/tailscale.git core-tailscale

          echo "=== 2. Патчим socks.go (включаем SOCKS5 и дефолтный ALL_PROXY) ==="
          python3 -c '
          path = "core-tailscale/net/netns/socks.go"
          with open(path, "r") as f:
              content = f.read()

          # Убираем запрет на сборку под android
          content = content.replace("!android && ", "")

          # Корректно добавляем импорт os внутрь import (...) блока
          content = content.replace(
              "import \"golang.org/x/net/proxy\"",
              "import (\n\t\"os\"\n\t\"golang.org/x/net/proxy\"\n)"
          )

          # Добавляем установку ALL_PROXY в init()
          content = content.replace(
              "wrapDialer = wrapSocks",
              "wrapDialer = wrapSocks\n\tos.Setenv(\"ALL_PROXY\", \"socks5://127.0.0.1:10808\")"
          )

          with open(path, "w") as f:
              f.write(content)

          print("socks.go patched successfully")
          '

          echo "=== 3. Патчим netns_android.go (обход 127.0.0.1 для локального прокси) ==="
          python3 -c '
          path = "core-tailscale/net/netns/netns_android.go"
          with open(path, "r") as f:
              content = f.read()

          old = "func controlC(network, address string, c syscall.RawConn) error {"
          new = old + "\n\tif isLocalhost(address) {\n\t\treturn nil\n\t}"

          if old in content:
              content = content.replace(old, new, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("netns_android.go patched successfully")
          else:
              print("Error: controlC pattern not found in netns_android.go")
              exit(1)
          '

          echo "=== 4. Проверяем валидность синтаксиса Go в пропатченном пакете ==="
          cd core-tailscale/net/netns
          go vet -tags android . || true
          cd ../../..

          echo "=== 5. Подменяем зависимость tailscale.com на наш пропатченный клон ==="
          go mod edit -replace tailscale.com=./core-tailscale

      - name: Build APK via Makefile
        run: |
          make tailscale-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug-apk
          path: tailscale-debug.apk
          retention-days: 7
