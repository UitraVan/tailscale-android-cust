name: Build Tailscale Proxy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Apply Proxy Patches
        run: |
          echo "=== 1. Патчим socks.go (включаем SOCKS5 для Android) ==="
          sed -i 's/!android && //g' tailscale/net/netns/socks.go

          echo "=== 2. Патчим netns_android.go (исключение для 127.0.0.1) ==="
          python3 -c "
          path = 'tailscale/net/netns/netns_android.go'
          with open(path, 'r') as f:
              content = f.read()
          old = 'func controlC(network, address string, c syscall.RawConn) error {'
          new = old + '\n\tif isLocalhost(address) {\n\t\treturn nil\n\t}'
          if old in content:
              content = content.replace(old, new, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print('netns_android.go patched')
          else:
              print('Warning: pattern not matched in netns_android.go')
          "

          echo "=== 3. Прописываем ALL_PROXY на localhost:10808 ==="
          python3 -c "
          path = 'tailscale/net/netns/socks.go'
          with open(path, 'r') as f:
              content = f.read()
          old = 'func init() {'
          new = old + '\n\tos.Setenv(\"ALL_PROXY\", \"socks5://127.0.0.1:10808\")'
          content = 'import \"os\"\n' + content.replace(old, new, 1)
          with open(path, 'w') as f:
              f.write(content)
          print('socks.go patched')
          "

          git diff tailscale/net/netns/

      - name: Build APK via Makefile
        run: |
          make tailscale-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug-apk
          path: tailscale-debug.apk
          retention-days: 7
